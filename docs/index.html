<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15392c" />
    <title>Race Cockpit</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f8f6;
        --panel: #ffffff;
        --ink: #14231d;
        --muted: #607168;
        --line: #d8e2dc;
        --accent: #2e6b4e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(760px, calc(100% - 28px));
        margin: 0 auto;
        padding: max(18px, env(safe-area-inset-top)) 0 max(22px, env(safe-area-inset-bottom));
      }

      .eyebrow {
        margin: 0 0 4px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(30px, 8vw, 52px);
        line-height: 1.02;
      }

      .routes {
        display: grid;
        gap: 10px;
      }

      a.route {
        display: block;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
        background: var(--panel);
        color: inherit;
        text-decoration: none;
      }

      a.route:active {
        transform: translateY(1px);
      }

      .route strong {
        display: block;
        margin-bottom: 5px;
        color: var(--accent);
        font-size: 20px;
        line-height: 1.15;
      }

      .route span {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Race Cockpit</p>
      <h1>Apps</h1>
      <section class="routes" aria-label="Race cockpit apps">
        <a class="route" href="./zuerich-test/">
          <strong>Zürich-Test</strong>
          <span>Aktuelle iPhone-Test-App mit GPX, POIs, Offline-Tab und Kern-Cache.</span>
        </a>
        <a class="route" href="./flensburg-rueckfahrt/">
          <strong>Raid Radar · Flensburg Rückfahrt</strong>
          <span>Next Raid, Tankstellen-Raid und Sonntagsfallenradar für die Rückfahrt nach Flensburg.</span>
        </a>
        <a class="route" href="./hamburg-backyard/">
          <strong>Hamburg Backyard</strong>
          <span>Ultra-Pair-Route mit Hamburg-Daten als eigener App-Bereich.</span>
        </a>
      </section>
    </main>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistration("./").then((registration) => registration?.unregister());
      }
    </script>
  </body>
</html>
