<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=../flensburg-rueckfahrt/" />
    <title>Weiterleitung · Raid Radar</title>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const registration of registrations) {
            if (registration.scope.includes("/flensburg-gutfahrt/")) registration.unregister();
          }
        });
      }
      location.replace("../flensburg-rueckfahrt/");
    </script>
  </head>
  <body>
